name: Build and publish site

# Edit the site on the `source` branch. Every push there renders the
# Quarto site and publishes the result to `master`, which GitHub Pages serves.
on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Uncomment if pages execute R / Python code:
      # - uses: r-lib/actions/setup-r@v2
      # - uses: actions/setup-python@v5

      - name: Render site
        run: quarto render

      - name: Publish to master (served by GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: master
          publish_dir: ./_site
          force_orphan: true
          commit_message: "Publish site from"
